<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tafuta Lost &amp; Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: an airline operations console in KQ-style crimson. Sidebar for navigation, a crimson welcome band on the overview, charcoal luggage-tag codes, white cards on warm paper. */
:root{
  --bg:#F7F3F1; --surface:#ffffff; --sunk:#FBF7F5; --ink:#211A1A; --muted:#75696A; --line:#EDE3DF; --line-2:#E2D5D1;
  --accent:#C8102E; --accent-dark:#A30D25; --accent-soft:#FBE7EA; --accent-ink:#ffffff; --charcoal:#211A1A;
  --good:#17803F; --good-soft:#E3F4E9; --warn:#B7791F; --warn-bar:#D69E2E; --warn-soft:#FBF0DC; --crit:#B42318; --crit-soft:#FDE8E6;
  --display:"Poppins","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --shadow:0 6px 20px rgba(110,20,30,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.005em}
h2{font-size:25px} h3{font-size:16.5px}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo .mk{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo b{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.06em;display:block;line-height:1.1}
.logo small{display:block;font-size:11.5px;color:var(--muted)}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:3px}
.mode button{border:0;background:transparent;padding:7px 6px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--accent-dark);font-weight:600;box-shadow:0 1px 4px rgba(110,20,30,.12)}
nav.tabs #tabs{display:grid;gap:3px}
nav.tabs a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:14.5px;font-weight:500}
nav.tabs a:hover{background:var(--sunk);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-dark);font-weight:600}
nav.tabs a .ct{margin-left:auto;min-width:20px;padding:0 7px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;text-align:center;font-weight:600;line-height:18px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:12.5px;color:var(--muted);display:grid;gap:4px}
.side-foot b{color:var(--ink);font-size:13.5px}
.side-foot .btn{justify-self:start;margin-top:6px;padding:5px 10px;font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.note{font-size:12.5px;color:var(--muted);padding:10px 36px;border-bottom:1px solid var(--line);background:var(--surface)}
.note b{color:var(--accent-dark)}
main{width:100%;max-width:1200px;padding:28px 36px 60px;display:grid;gap:18px;align-content:start}
footer{max-width:1200px;padding:0 36px 30px;color:var(--muted);font-size:12.5px}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column;padding:14px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  nav.tabs #tabs{display:flex;overflow-x:auto;gap:4px}
  nav.tabs a{white-space:nowrap;padding:8px 10px}
  .side-foot{display:none}
  main{padding:20px 16px 48px} .note{padding:8px 16px} footer{padding:0 16px 24px}
}

/* crimson band */
.band{background:var(--accent);color:#fff;margin:-28px -36px 0;padding:30px 36px 92px;position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:flex-start;gap:16px 24px;flex-wrap:wrap}
.band::after{content:"";position:absolute;right:-90px;top:-140px;width:520px;height:520px;border-radius:50%;border:64px solid rgba(255,255,255,.06);pointer-events:none}
.band small{font-size:13px;opacity:.88}
.band h2{font-size:28px;margin:4px 0 6px;color:#fff}
.band p{font-size:14.5px;opacity:.92}
.band .btn{position:relative;flex:none;z-index:2;background:#fff;color:var(--accent-dark);border-color:#fff;font-weight:600;padding:10px 16px;border-radius:10px}
.band .btn:hover{background:#FFF3F5}
.tiles.over{margin-top:-74px;position:relative;z-index:1}
@media (max-width:860px){.band{margin:-20px -16px 0;padding:22px 16px 86px}}

/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.tile .n{font-family:var(--display);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:13px}
.tile.attn .n{color:var(--accent)}
.head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h2+p{margin-top:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:10px;align-content:start}
.li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #F3ECE9}
.stack>h3+.li,.head+.li{border-top:0}
.li.top-al{align-items:start;padding:0;border-top:0}
.tagid{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--charcoal);color:#fff;padding:2px 7px;border-radius:5px;letter-spacing:.02em;white-space:nowrap}
.refid{display:inline-block;font-family:var(--mono);font-size:11.5px;border:1px solid #CDBFBF;color:#4A3F3F;padding:1px 6px;border-radius:5px;white-space:nowrap;background:var(--surface)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;text-decoration:none}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-crit{background:var(--crit-soft);color:var(--crit)} .p-acc{background:var(--accent-soft);color:var(--accent-dark)} .p-mut{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.btn{border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.btn.amb{background:var(--charcoal);border-color:var(--charcoal);color:#fff}
.btn.amb:hover{background:#3A2F2F;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
td{padding:12px 14px;border-bottom:1px solid #F3ECE9;vertical-align:top}
.tbl{overflow-x:auto}
.num{font-variant-numeric:tabular-nums}

/* forms */
form .f{display:grid;gap:5px}
label{font-size:13px;font-weight:600;color:#4A3F3F}
input[type=text],input[type=datetime-local],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--sunk)}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--accent);background:#fff;outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
textarea{min-height:80px;resize:vertical}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--ink);font-weight:400}
.hint{font-size:12.5px;color:var(--muted)}

/* match */
.match{display:grid;grid-template-columns:minmax(240px,1fr) minmax(280px,1.5fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.match>div{padding:16px 18px;align-content:start}
.match .lhs{background:var(--sunk);border-right:1px solid var(--line)}
@media (max-width:760px){.match{grid-template-columns:1fr}.match .lhs{border-right:0;border-bottom:1px solid var(--line)}}
.cand{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.cand.best{border:2px solid var(--accent)}
.conf{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.c-high{color:var(--good)} .c-medium{color:var(--warn)} .c-low{color:var(--muted)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;font-size:12.5px}
.bar{height:7px;background:#F1E9E6;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.clock{height:7px;background:#F1E9E6;border-radius:9px;overflow:hidden;min-width:80px}
.clock i{display:block;height:100%;border-radius:9px}
.thumb{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:22px;height:22px}
.feed{display:grid}
.feed>div{padding:10px 0;border-bottom:1px solid #F3ECE9;display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:14px}
.feed>div:last-child{border-bottom:0}
.msg{background:var(--sunk);border:1px solid var(--line);border-radius:14px 14px 14px 3px;padding:10px 13px;font-size:14px}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0}
.callout.acc{border-left-color:var(--accent);background:var(--accent-soft)}

/* timeline */
.tl{display:grid;margin-top:6px}
.tl>div{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:16px;position:relative}
.tl>div::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl>div:last-child::before{display:none}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface)}
.tl .done .dot{background:var(--accent);border-color:var(--accent)}
.tl .now .dot{background:var(--surface);border:6px solid var(--accent)}

/* process compare */
.flow{display:grid;gap:10px;counter-reset:s;padding:0;margin:0}
.flow li{list-style:none;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.flow li::before{counter-increment:s;content:counter(s);font-family:var(--mono);font-size:12px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);border:1px solid var(--line-2)}
.flow.new li::before{background:var(--accent);color:#fff;border-color:var(--accent)}
.integ{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.integ div{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--sunk)}
.integ b{display:block;margin-bottom:3px;font-family:var(--display);font-weight:600}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(33,26,26,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:16px;max-width:620px;width:100%;max-height:90%;overflow:auto;padding:22px;display:grid;gap:14px;border:1px solid var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--charcoal);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;z-index:30;max-width:90%}
@media (prefers-reduced-motion: no-preference){.btn,nav.tabs a{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="logo"><div class="mk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></div><div><b>TAFUTA</b><small>Lost &amp; Found recovery</small></div></div>
  <div class="mode" role="group" aria-label="Switch view">
    <button id="m-staff" type="button">Staff</button>
    <button id="m-pax" type="button">Passenger</button>
  </div>
  <nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
  <div class="side-foot"><b id="who">J. Mutiso</b><span id="who2">Security Control Room, JKIA</span><button class="btn" id="reset" type="button">Reset demo data</button></div>
</aside>
<div class="main">
  <div class="note"><b>Prototype</b> for the Kenya Airways Innovation Challenge 2026 · Intelligent Digital Lost &amp; Found. All people, bookings and items are fictional; messages are simulated.</div>
  <main id="app"></main>
  <footer>Tafuta prototype · Valerie Mwangi, USIU-Africa · v0.2</footer>
</div>
</div>
<div id="layer"></div>

<script>
/* ---------- Tafuta matching engine (no DOM) ---------- */
const DAY = 864e5, HOUR = 36e5, HOLD_DAYS = 90;
const CATS = ['Electronics','Bags & luggage','Documents & IDs','Clothing','Jewellery & watches','Eyewear','Toys','Personal items','Other'];
const RELATED = {'Bags & luggage|Personal items':0.4,'Jewellery & watches|Personal items':0.4,'Eyewear|Personal items':0.4,'Electronics|Personal items':0.3,'Documents & IDs|Personal items':0.4,'Clothing|Personal items':0.3,'Toys|Personal items':0.3};
const COLOURS = {black:'dark',grey:'grey',silver:'grey',white:'light',cream:'light',blue:'blue',navy:'blue',red:'red',maroon:'red',green:'green',olive:'green',brown:'brown',tan:'brown',beige:'brown',pink:'pink',purple:'purple',yellow:'gold',gold:'gold',orange:'orange',multicoloured:'multi'};
const STOP = new Set('a an the and or of with in on at to for my is it its was has have had from by i me this that very some small large big one two inside think left near also there their our we item lost found'.split(' '));
const SYN = {mobile:'phone',smartphone:'phone',cellphone:'phone',handset:'phone',galaxy:'phone',iphone:'phone',macbook:'laptop',rucksack:'backpack',knapsack:'backpack',daypack:'backpack',coat:'jacket',hoodie:'jacket',sweater:'jacket',jumper:'jacket',fleece:'jacket',spectacles:'glasses',specs:'glasses',eyeglasses:'glasses',sunglasses:'glasses',airpods:'earbuds',earphones:'earbuds',headphones:'earbuds',purse:'wallet',ipad:'tablet',flask:'bottle',tumbler:'bottle',plush:'teddy',bear:'teddy',toy:'teddy',powerbank:'charger',adapter:'charger',cable:'charger',tortoise:'tortoiseshell',gray:'grey',cover:'case',kindle:'ereader',cellular:'phone'};
const CANON = new Set(Object.values(SYN));

function toks(s){
  return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/)
    .filter(w => w.length > 1 && !STOP.has(w))
    .map(w => { w = SYN[w] || w; if (!CANON.has(w) && w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) w = w.slice(0,-1); return SYN[w] || w; });
}
const docText = x => [x.title, x.desc, x.brand, x.colour].join(' ');

function buildIdf(docs){
  const df = {}, N = docs.length;
  docs.forEach(d => new Set(toks(docText(d))).forEach(t => df[t] = (df[t]||0) + 1));
  const idf = {}; for (const t in df) idf[t] = Math.log(1 + N/df[t]);
  idf.__default = Math.log(1 + N);
  return idf;
}
function vec(x, idf){
  const v = {}; toks(docText(x)).forEach(t => v[t] = (v[t]||0) + 1);
  for (const t in v) v[t] *= (idf[t] || idf.__default);
  return v;
}
function cosine(a, b){
  let d = 0, na = 0, nb = 0;
  for (const t in a){ na += a[t]*a[t]; if (b[t]) d += a[t]*b[t]; }
  for (const t in b) nb += b[t]*b[t];
  return na && nb ? d/Math.sqrt(na*nb) : 0;
}
function colourScore(a, b){
  if (!a || !b) return null;
  if (a === b) return 1;
  if (COLOURS[a] && COLOURS[a] === COLOURS[b]) return 0.6;
  if (a === 'multicoloured' || b === 'multicoloured') return 0.4;
  return 0;
}
/* r = lost report, f = found item. Returns null if the pair is impossible. */
function scorePair(r, f, idf){
  const dh = (f.foundAt - r.lostAt) / HOUR;
  if (dh < -24) return null;                       // found long before it was lost
  const parts = [];
  const cat = r.cat === f.cat ? 1 : (RELATED[r.cat+'|'+f.cat] || RELATED[f.cat+'|'+r.cat] || 0);
  parts.push({key:'cat', label:'Category', w:20, s:cat});
  const vr = vec(r, idf), vf = vec(f, idf), c = cosine(vr, vf);
  const text = Math.min(1, c * 1.35);
  const shared = Object.keys(vr).filter(t => vf[t]).sort((x,y) => (idf[y]||0) - (idf[x]||0)).slice(0,5);
  parts.push({key:'text', label:'Description', w:30, s:text, note: shared.length ? 'Shared: ' + shared.join(', ') : 'No shared details'});
  const col = colourScore(r.colour, f.colour);
  if (col !== null) parts.push({key:'colour', label:'Colour', w:12, s:col});
  if (r.brand && f.brand) parts.push({key:'brand', label:'Brand', w:12, s: r.brand.trim().toLowerCase() === f.brand.trim().toLowerCase() ? 1 : 0});
  let loc, locNote;
  if (r.flight && f.flight && r.flight === f.flight){
    if (r.seat && f.seat && r.seat.toUpperCase() === f.seat.toUpperCase()){ loc = 1; locNote = 'Same flight and seat'; }
    else { loc = 0.85; locNote = 'Same flight'; }
  } else if (r.station === f.station){ loc = 0.6; locNote = 'Same station'; }
  else { loc = 0.15; locNote = 'Different station'; }
  parts.push({key:'loc', label:'Where', w:14, s:loc, note:locNote});
  const time = dh <= 48 ? 1 : Math.max(0.2, 1 - (dh - 48) / (24*28) * 0.8);
  parts.push({key:'time', label:'When', w:12, s:time, note: dh < 0 ? 'Logged just before the reported time' : 'Found ' + (dh < 24 ? Math.round(Math.max(dh,0)) + ' h' : Math.round(dh/24) + ' days') + ' after loss'});
  if (cat === 0 && text < 0.3) return null;
  const W = parts.reduce((a,p) => a + p.w, 0);
  const score = Math.min(0.99, parts.reduce((a,p) => a + p.w * p.s, 0) / W);
  return {score, parts};
}
function band(score){ return score >= 0.75 ? 'high' : score >= 0.55 ? 'medium' : 'low'; }


/* ---------- Demo data (fictional) ---------- */
const STATIONS = {NBO:'Nairobi (JKIA)', MBA:'Mombasa', KIS:'Kisumu', EDL:'Eldoret'};
const KQ_CUSTODY = 'KQ Security Control Room';
const KAA_CUSTODY = 'KAA Security, JKIA';

/* Stand-in for the booking system (PSS) manifest lookup */
function demoManifest(now){
  return [
    {pnr:'K7QM2D', first:'Wanjiru', last:'Kamau',  flight:'KQ101', route:'LHR–NBO', seat:'14A', dep: now - 1.45*DAY, contact:'+254 712 ••• 483', channel:'WhatsApp'},
    {pnr:'R5JD7N', first:'Lucy',    last:'Achieng',flight:'KQ101', route:'LHR–NBO', seat:'22C', dep: now - 1.45*DAY, contact:'lucy.a•••@gmail.com', channel:'Email'},
    {pnr:'P3ZT8L', first:'Daniel',  last:'Otieno', flight:'KQ604', route:'NBO–MBA', seat:'9C',  dep: now - 4.1*DAY,  contact:'+254 722 ••• 916', channel:'KQ app'},

<script>
/* ---------- state ---------- */
const NOW = Date.now();
const KEY = 'tafuta-demo-v1';
let S, MANIFEST = demoManifest(NOW);
function load(){ try{ const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); }catch(e){} return demoState(NOW); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
S = load();
const OFFICER = 'J. Mutiso, KQ Security';

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const fmtD = t => new Date(t).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const ago = t => { const h = (Date.now() - t)/HOUR; return h < 1 ? 'just now' : h < 24 ? Math.round(h) + ' h ago' : Math.round(h/24) + ' d ago'; };
const daysIn = f => Math.floor((Date.now() - f.foundAt)/DAY);
const findItem = id => S.found.find(f => f.id === id);
const findRep = id => S.reports.find(r => r.id === id);
function log(actor, action, ref){ S.audit.push({t:Date.now(), actor, action, ref}); }
function notify(r, msg){ S.notices.push({t:Date.now(), to: r.name + ' · ' + r.channel, ref:r.id, msg}); }
function toast(m){ const el = document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=m; document.body.appendChild(el); setTimeout(()=>el.remove(), 3200); }
const ICONS = {
  'Electronics':'<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
  'Bags & luggage':'<rect x="4" y="8" width="16" height="12" rx="2"/><path d="M9 8V5h6v3"/>',
  'Documents & IDs':'<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  'Clothing':'<path d="M8 4l-4 3 2 4 2-1v10h8V10l2 1 2-4-4-3c-1 2-3 2-4 2s-3 0-4-2z"/>',
  'Jewellery & watches':'<circle cx="12" cy="14" r="6"/><path d="M9 4h6l-1 4h-4z"/>',
  'Eyewear':'<circle cx="7" cy="14" r="3.5"/><circle cx="17" cy="14" r="3.5"/><path d="M10.5 14h3M3.5 13 3 9M20.5 13l.5-4"/>',
  'Toys':'<circle cx="12" cy="13" r="6"/><circle cx="7" cy="7" r="2.2"/><circle cx="17" cy="7" r="2.2"/>',
  'Personal items':'<rect x="8" y="2" width="8" height="4" rx="1"/><rect x="7" y="6" width="10" height="16" rx="3"/>',
  'Other':'<rect x="4" y="6" width="16" height="13" rx="1"/><path d="M4 10h16"/>'
};
const thumb = f => `<div class="thumb" aria-hidden="true">${f.photo ? `<img src="${f.photo}" alt="">` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">${ICONS[f.cat]||ICONS.Other}</svg>`}</div>`;
const statusPill = {
  in_custody:'<span class="pill p-acc">In custody</span>', on_hold:'<span class="pill p-warn">Held for claim</span>',
  released:'<span class="pill p-good">Returned</span>', customs:'<span class="pill p-mut">Handed to Customs</span>'
};
const repPill = {
  open:'<span class="pill p-acc">Searching</span>', notified:'<span class="pill p-warn">Passenger notified</span>',
  returned:'<span class="pill p-good">Returned</span>'
};
function clock(f){
  const d = daysIn(f), pct = Math.min(100, d/HOLD_DAYS*100);
  const col = d >= HOLD_DAYS ? 'var(--crit)' : d >= 60 ? 'var(--warn)' : 'var(--accent)';
  const barCol = d >= 60 && d < HOLD_DAYS ? 'var(--warn-bar)' : col;
  const label = d >= HOLD_DAYS ? 'Due for Customs' : (HOLD_DAYS - d) + ' days left';
  return `<div class="stack" style="gap:3px"><div class="clock" role="img" aria-label="Day ${d} of ${HOLD_DAYS}"><i style="width:${pct}%;background:${barCol}"></i></div><span class="small ${d>=60?'':'muted'}" style="${d>=60?'color:'+col:''}">Day ${d} of ${HOLD_DAYS} · ${label}</span></div>`;
}

/* ---------- matching over state ---------- */
function idf(){ return buildIdf([...S.found, ...S.reports]); }
function candidatesFor(r, I = idf()){
  return S.found.filter(f => (f.status === 'in_custody' || f.id === r.matchedItem) && !r.dismissed.includes(f.id))
    .map(f => ({f, m: scorePair(r, f, I)})).filter(x => x.m && x.m.score >= 0.4)
    .sort((a,b) => b.m.score - a.m.score);
}
function bestFor(f, I = idf()){
  let best = null;
  S.reports.filter(r => r.status === 'open' && !r.dismissed.includes(f.id)).forEach(r => {
    const m = scorePair(r, f, I); if (m && (!best || m.score > best.m.score)) best = {r, m};
  });
  return best;
}
function manifestFor(f){
  if (!f.flight || !f.seat) return null;
  return MANIFEST.find(p => p.flight === f.flight && p.seat.toUpperCase() === f.seat.toUpperCase() && Math.abs(p.dep - f.foundAt) < 2*DAY) || null;
}
function proactiveList(){
  return S.found.filter(f => f.status === 'in_custody' && !f.proactive && manifestFor(f)
    && !S.reports.some(r => r.pnr === manifestFor(f).pnr && r.status !== 'returned'));
}

/* ---------- routing ---------- */
const STAFF_TABS = [['overview','Overview'],['queue','Match queue'],['items','Custody register'],['log','Log found item'],['customs','Customs handover'],['audit','Audit & messages'],['fit','How it fits KQ']];
const PAX_TABS = [['report','Report a lost item'],['track','Track my report']];
function route(){
  const h = (location.hash || '').slice(1);
  const all = [...STAFF_TABS, ...PAX_TABS].map(t => t[0]);
  return all.includes(h) ? h : 'overview';
}
function counts(){
  const I = idf();
  return {
    queue: S.reports.filter(r => r.status === 'open' && candidatesFor(r, I).some(c => c.m.score >= 0.75)).length + proactiveList().length,
    customs: S.found.filter(f => f.status === 'in_custody' && daysIn(f) >= HOLD_DAYS).length
  };
}
function render(){
  const v = route(), pax = PAX_TABS.some(t => t[0] === v);
  $('#m-staff').setAttribute('aria-pressed', String(!pax)); $('#who').textContent = pax ? 'Passenger view' : 'J. Mutiso'; $('#who2').textContent = pax ? 'As it would appear in the KQ app' : 'Security Control Room, JKIA'; $('#m-pax').setAttribute('aria-pressed', String(pax));
  const c = pax ? {} : counts();
  $('#tabs').innerHTML = (pax ? PAX_TABS : STAFF_TABS).map(([k,l]) => `<a href="#${k}" ${k===v?'aria-current="page"':''}>${l}${c[k]?`<span class="ct">${c[k]}</span>`:''}</a>`).join('');
  $('#app').innerHTML = VIEWS[v]();
  (BIND[v] || (()=>{}))();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
$('#m-staff').onclick = () => location.hash = 'overview';
$('#m-pax').onclick = () => location.hash = 'report';
$('#reset').onclick = () => { try{ localStorage.removeItem(KEY); }catch(e){} S = demoState(Date.now()); render(); toast('Demo data reset'); };

/* ---------- views ---------- */
const VIEWS = {}, BIND = {};

VIEWS.overview = () => {
  const I = idf();
  const inC = S.found.filter(f => f.status === 'in_custody' || f.status === 'on_hold');
  const open = S.reports.filter(r => r.status !== 'returned');
  const ready = S.reports.filter(r => r.status === 'open' && candidatesFor(r, I).some(c => c.m.score >= 0.75));
  const returned = S.reports.filter(r => r.status === 'returned').length;
  const closed = returned + S.found.filter(f => f.status === 'customs').length;
  const pro = proactiveList();
  const aging = S.found.filter(f => f.status === 'in_custody' && daysIn(f) >= 60).sort((a,b) => a.foundAt - b.foundAt);
  const kaa = S.found.filter(f => f.status === 'in_custody' && f.custodian === KAA_CUSTODY);
  const stations = Object.keys(STATIONS).map(s => [s, inC.filter(f => f.station === s).length]);
  const maxS = Math.max(1, ...stations.map(x => x[1]));
  return `
  <section class="band"><div><small>${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} · JKIA Terminal 1A</small><h2>Good ${new Date().getHours() < 12 ? 'morning' : new Date().getHours() < 17 ? 'afternoon' : 'evening'}, Security Control Room</h2><p>${ready.length} strong match${ready.length===1?'':'es'} and ${pro.length} seat match${pro.length===1?'':'es'} waiting for you.</p></div><a class="btn" href="#log">+ Log a found item</a></section>
  <div class="tiles over">
    <div class="tile"><div class="n">${inC.length}</div><div class="l">Items in custody</div></div>
    <div class="tile"><div class="n">${open.length}</div><div class="l">Open passenger reports</div></div>
    <div class="tile ${ready.length?'attn':''}"><div class="n">${ready.length}</div><div class="l">Strong matches to action</div></div>
    <div class="tile ${pro.length?'attn':''}"><div class="n">${pro.length}</div><div class="l">Seat matches: tell passenger first</div></div>
    <div class="tile"><div class="n">${closed ? Math.round(returned/closed*100) : 0}%</div><div class="l">Return rate on closed cases</div></div>
  </div>
  <div class="grid g2">
    <section class="card stack">
      <div class="head"><h3>Needs a person</h3><a href="#queue" class="small">Open match queue</a></div>
      ${ready.map(r => { const c = candidatesFor(r, I)[0]; return `<div class="li">${thumb(c.f)}<div><b>${esc(r.title)}</b><div class="small muted"><span class="refid">${r.id}</span> ↔ <span class="tagid">${c.f.id}</span></div></div><span class="conf c-high" style="font-size:22px">${Math.round(c.m.score*100)}%</span></div>`; }).join('')}
      ${pro.map(f => { const p = manifestFor(f); return `<div class="li">${thumb(f)}<div><b>${esc(f.title)}</b><div class="small muted"><span class="tagid">${f.id}</span> · seat ${f.seat} on ${f.flight}. Booking ${p.pnr} found, not yet reported lost</div></div><a class="pill p-warn" href="#queue">Tell passenger</a></div>`; }).join('')}
      ${kaa.map(f => `<div class="li">${thumb(f)}<div><b>${esc(f.title)}</b><div class="small muted"><span class="tagid">${f.id}</span> · held by KAA, handover to KQ pending</div></div><a class="btn small" href="#items">Open</a></div>`).join('')}
      ${!ready.length && !pro.length && !kaa.length ? '<p class="muted">Nothing waiting. New matches appear here automatically.</p>' : ''}
    </section>
    <section class="card stack">
      <div class="head"><h3>90-day holding clock</h3><a href="#customs" class="small">Customs handover</a></div>
      ${aging.length ? aging.map(f => `<div class="li">${thumb(f)}<div><b>${esc(f.title)}</b><div class="small muted"><span class="tagid">${f.id}</span> · ${esc(f.spot)}</div></div><div style="width:170px">${clock(f)}</div></div>`).join('') : '<p class="muted">No items past day 60.</p>'}
      <p class="hint">KQ policy: unclaimed items are held up to 90 days, then itemised and handed to Customs.</p>
    </section>
    <section class="card stack">
      <h3>In custody by station</h3>
      <div class="bars" style="grid-template-columns:auto 1fr auto;font-size:14px">${stations.map(([s,n]) => `<span class="mono">${s}</span><div class="bar" style="height:10px"><i style="width:${n/maxS*100}%"></i></div><span class="num">${n}</span>`).join('')}</div>
    </section>
    <section class="card stack">
      <div class="head"><h3>Latest activity</h3><a href="#audit" class="small">Full audit trail</a></div>
      <div class="feed">${S.audit.slice().sort((a,b)=>b.t-a.t).slice(0,6).map(a => `<div><span class="small muted">${ago(a.t)}</span><span>${esc(a.action)} <span class="small muted">· ${esc(a.actor)}</span></span></div>`).join('')}</div>
    </section>
  </div>`;
};

function candHTML(r, c, i){
  const m = c.m, b = band(m.score), held = r.matchedItem === c.f.id;
  return `<div class="cand ${i===0?'best':''}">
    <div class="li top-al">
      ${thumb(c.f)}<div><b>${esc(c.f.title)}</b><div class="small muted"><span class="tagid">${c.f.id}</span> · ${esc(c.f.spot)}${c.f.flight?' · '+c.f.flight:''}${c.f.seat?' seat '+c.f.seat:''} · ${STATIONS[c.f.station]}</div><div class="small">${esc(c.f.desc)}</div></div>
      <div style="text-align:right"><div class="conf c-${b}">${Math.round(m.score*100)}%</div><div class="small muted">${b} confidence</div></div>
    </div>
    <div class="bars">${m.parts.map(p => `<span>${p.label}</span><div class="bar"><i style="width:${Math.round(p.s*100)}%"></i></div><span class="muted">${esc(p.note || Math.round(p.s*100)+'%')}</span>`).join('')}</div>
    <div class="row">
      ${held ? `<button class="btn pri" data-act="release" data-r="${r.id}" data-f="${c.f.id}">Verify &amp; release</button><button class="btn ghost" data-act="fail" data-r="${r.id}" data-f="${c.f.id}">Claim did not check out</button>`
             : r.status === 'open' ? `<button class="btn pri" data-act="notify" data-r="${r.id}" data-f="${c.f.id}">Hold item &amp; notify passenger</button><button class="btn ghost" data-act="dismiss" data-r="${r.id}" data-f="${c.f.id}">Not a match</button>` : ''}
    </div></div>`;
}
VIEWS.queue = () => {
  const I = idf();
  const reps = S.reports.filter(r => r.status !== 'returned').sort((a,b) => {
    const sa = (candidatesFor(a,I)[0]||{m:{score:0}}).m.score, sb = (candidatesFor(b,I)[0]||{m:{score:0}}).m.score; return sb - sa; });
  const pro = proactiveList();

BIND.queue = () => {
  $('#app').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const r = findRep(b.dataset.r), f = findItem(b.dataset.f), a = b.dataset.act;
    if (a === 'notify'){
      r.status = 'notified'; r.matchedItem = f.id; f.status = 'on_hold'; f.matchedReport = r.id;
      notify(r, `Jambo ${r.name.split(' ')[0]}, we may have found your ${r.title.toLowerCase()} (ref ${r.id}). Please bring your ID and boarding pass to the KQ Lost & Found desk at ${STATIONS[f.station]}, or reply to have it forwarded to you.`);
      log(OFFICER, `Held ${f.id} and notified passenger`, r.id); save(); render(); toast('Passenger notified by ' + r.channel);
    } else if (a === 'dismiss'){
      r.dismissed.push(f.id); log(OFFICER, `Marked ${f.id} as not a match`, r.id); save(); render();
    } else if (a === 'fail'){
      r.status = 'open'; r.matchedItem = null; r.dismissed.push(f.id); f.status = 'in_custody'; f.matchedReport = null;
      log(OFFICER, `Claim on ${f.id} failed verification; item back in custody`, r.id); save(); render();
    } else if (a === 'release'){ releaseModal(r, f); }
    else if (a === 'proactive'){
      const p = manifestFor(f); f.proactive = {t:Date.now(), pnr:p.pnr};
      const id = f.station + 'KQ' + (S.seq.report++);
      S.reports.push({id, pnr:p.pnr, name:p.first+' '+p.last, contact:p.contact, channel:p.channel, flight:p.flight, seat:p.seat, station:f.station, cat:f.cat, title:'Item left at seat '+p.seat, desc:'Opened proactively from a seat match. Passenger to describe the item.', colour:'', brand:'', lostAt:p.dep, reportedAt:Date.now(), status:'notified', matchedItem:f.id, dismissed:[], proactive:true});
      f.status = 'on_hold'; f.matchedReport = id;
      S.notices.push({t:Date.now(), to:p.first+' '+p.last+' · '+p.channel, ref:id, msg:`Jambo ${p.first}, our crew found an item at your seat (${p.seat}) after flight ${p.flight}. If you're missing something, reply with a short description and we'll arrange its return. Ref ${id}.`});
      log('Tafuta engine', `Proactive message sent to booking ${p.pnr} for ${f.id}`, id); save(); render(); toast('Proactive message sent by ' + p.channel);
    }
  });
};

    <div><b>SITA WorldTracer</b><span class="small">Passenger references follow the WorldTracer pattern (station + KQ + number) baggage staff already know. Optional sync for items that turn up in baggage.</span></div>
    <div><b>KAA Security, JKIA</b><span class="small">A KAA login to log items and confirm handovers, so terminal finds reach KQ with a chain of custody.</span></div>
    <div><b>Staff sign-in &amp; data</b><span class="small">Single sign-on with KQ staff accounts. Role-based access, full audit trail, retention rules in line with Kenya's Data Protection Act, 2019.</span></div>
  </div></section>
  <section class="card stack"><h3>How the matching works</h3>
  <p>Each report is scored against every item in custody on six signals: category, description (weighted text similarity with airline-specific synonyms, so "rucksack" finds "backpack"), colour family, brand, where it was lost (same flight and seat scores highest) and time. Staff see the score and the reason for it, and confirm every match. In production the photo goes through image recognition to fill in brand, colour and category automatically, and the text model is upgraded to multilingual embeddings for English and Swahili reports.</p></section>`;

/* ---------- passenger views ---------- */
VIEWS.report = () => `
  <div class="head"><div><h2>Lost something on your journey?</h2><p class="muted">Tell us what it is. We check it against everything found on our aircraft, gates, lounges and offices, and keep checking for 90 days.</p></div></div>
  <form id="pf" class="card stack" style="max-width:760px">
    <div class="fgrid">
      <div class="f"><label for="p-pnr">Booking reference</label><input type="text" id="p-pnr" maxlength="6" placeholder="6 characters, e.g. B8LK3S" autocomplete="off"></div>
      <div class="f"><label for="p-last">Last name</label><input type="text" id="p-last" placeholder="As on your booking"></div>
    </div>
    <div class="row"><button type="button" class="btn" id="p-find">Find my flight</button><span id="p-bk" class="small muted">Demo bookings: B8LK3S Njeri, K7QM2D Kamau</span></div>
    <div class="fgrid">
      <div class="f"><label for="p-fl">Flight</label><input type="text" id="p-fl" placeholder="KQ418"></div>
      <div class="f"><label for="p-seat">Seat (if lost on board)</label><input type="text" id="p-seat"></div>
      <div class="f"><label for="p-st">Airport</label><select id="p-st">${Object.entries(STATIONS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
    </div>
    <div class="fgrid">
      <div class="f"><label for="p-cat">What kind of item?</label><select id="p-cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="f"><label for="p-title">Short name</label><input type="text" id="p-title" required placeholder="e.g. Black leather handbag"></div>
      <div class="f"><label for="p-col">Main colour</label><select id="p-col"><option value="">Not sure</option>${Object.keys(COLOURS).map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="f"><label for="p-brand">Brand</label><input type="text" id="p-brand"></div>
    </div>
    <div class="f"><label for="p-desc">Describe it</label><textarea id="p-desc" required placeholder="Anything that makes it yours: stickers, case, contents, where you last had it."></textarea></div>
    <div class="fgrid">
      <div class="f"><label for="p-name">Your name</label><input type="text" id="p-name" required></div>
      <div class="f"><label for="p-con">Phone or email</label><input type="text" id="p-con" required></div>
      <div class="f"><label for="p-ch">Send updates by</label><select id="p-ch"><option>WhatsApp</option><option>SMS</option><option>Email</option><option>KQ app</option></select></div>
    </div>
    <label class="check"><input type="checkbox" id="p-ok" required> I agree that my details are used only to find and return this item.</label>
    <div class="row"><button class="btn pri">Submit report</button></div>
  </form><div id="pres"></div>`;
BIND.report = () => {
  $('#p-find').onclick = () => {
    const p = MANIFEST.find(x => x.pnr === $('#p-pnr').value.trim().toUpperCase() && x.last.toLowerCase() === $('#p-last').value.trim().toLowerCase());
    if (!p){ $('#p-bk').textContent = 'No booking found. Check the reference and last name, or fill in your flight below.'; return; }
    $('#p-fl').value = p.flight; $('#p-seat').value = p.seat; $('#p-name').value = p.first + ' ' + p.last; $('#p-con').value = p.contact; $('#p-ch').value = p.channel;
    $('#p-st').value = p.route.split('–')[1] in STATIONS ? p.route.split('–')[1] : 'NBO';
    $('#p-bk').innerHTML = `Found <b>${p.flight}</b> ${p.route}, seat ${p.seat}, ${fmtD(p.dep)}.`;
  };
  $('#pf').onsubmit = e => { e.preventDefault();
    const st = $('#p-st').value, id = st + 'KQ' + (S.seq.report++);
    const p = MANIFEST.find(x => x.pnr === $('#p-pnr').value.trim().toUpperCase());
    const r = {id, pnr:$('#p-pnr').value.trim().toUpperCase(), name:$('#p-name').value.trim(), contact:$('#p-con').value.trim(), channel:$('#p-ch').value, flight:$('#p-fl').value.trim().toUpperCase(), seat:$('#p-seat').value.trim().toUpperCase(),
      station:st, cat:$('#p-cat').value, title:$('#p-title').value.trim(), desc:$('#p-desc').value.trim(), colour:$('#p-col').value, brand:$('#p-brand').value.trim(),
      lostAt: p ? p.dep : Date.now() - 6*HOUR, reportedAt:Date.now(), status:'open', matchedItem:null, dismissed:[]};
    S.reports.push(r); log(r.name + ' (' + r.channel + ')', 'Reported lost item', id);
    const top = candidatesFor(r)[0];
    if (top && top.m.score >= 0.75) log('Tafuta engine', `Auto-alert: ${Math.round(top.m.score*100)}% match with ${top.f.id}`, id);
    S.notices.push({t:Date.now(), to:r.name+' · '+r.channel, ref:id, msg:`We've received your report (ref ${id}). We're checking it against items found across the Kenya Airways network and will message you here as soon as there's a likely match.`});
    save();
    $('#pf').style.display = 'none';
    $('#pres').innerHTML = `<div class="card stack" style="max-width:760px"><h3>Report received</h3><p>Your reference is <span class="refid" style="font-size:15px">${id}</span>. We've sent it to you by ${esc(r.channel)}.</p>
      <p class="muted">We'll message you if a likely match is found. To collect, bring a valid ID and your boarding pass or booking reference. If you've travelled on, we can forward the item to your station.</p>
      <div class="row"><a class="btn pri" href="#track" onclick="sessionStorage && (window.__ref='${id}')">Track this report</a><button class="btn ghost" onclick="location.hash='overview'">See it in the staff console</button></div></div>`;
  };
};

VIEWS.track = () => `<div class="head"><div><h2>Track my report</h2><p class="muted">Enter the reference we sent you.</p></div></div>
  <form id="tf" class="card row" style="max-width:760px"><input type="text" id="t-ref" placeholder="e.g. NBOKQ10452" style="max-width:260px" aria-label="Report reference"><button class="btn pri">Check status</button><span class="small muted">Try NBOKQ10452 or NBOKQ10483</span></form>
  <div id="tres"></div>`;
BIND.track = () => {
  const show = ref => {
    const r = findRep(ref.trim().toUpperCase());
    if (!r){ $('#tres').innerHTML = '<div class="card" style="max-width:760px">We couldn\'t find that reference. Check it matches the message we sent, for example NBOKQ10452.</div>'; return; }
    const stage = r.status === 'returned' ? 3 : r.status === 'notified' ? 2 : 1;
    const steps = [['Report received', fmt(r.reportedAt)], ['Checking found items across the network', 'Re-checked whenever a new item is logged'], ['Possible match: we\'ve contacted you', 'Bring a valid ID and your boarding pass, or reply to arrange forwarding'], ['Returned to you', r.release ? fmt(r.release.t) + ' · ' + r.release.method : '']];
    $('#tres').innerHTML = `<div class="card stack" style="max-width:760px"><div class="row" style="justify-content:space-between"><b>${esc(r.title)}</b><span class="refid">${r.id}</span></div>
      <div class="tl">${steps.map((s,i) => `<div class="${i<stage?'done':i===stage?'now':''}"><span class="dot"></span><div><b>${s[0]}</b><div class="small muted">${i<=stage?esc(s[1]):''}</div></div></div>`).join('')}</div>
      <p class="hint">For security we don't show photos or details of found items here. Staff check ownership in person.</p></div>`;
  };
  $('#tf').onsubmit = e => { e.preventDefault(); show($('#t-ref').value); };
  if (window.__ref){ $('#t-ref').value = window.__ref; show(window.__ref); window.__ref = null; }
};

render();
</script>
</body>
</html>
